      # /* CI_STEPS_PLACEHOLDER_START */
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Code Quality (Lint)
        run: python -m flake8 --exclude=.git,__pycache__,tools,tests
      - name: Run Tests
        run: if [ -d tests ]; then python -m unittest discover -s tests; fi
      # /* CI_STEPS_PLACEHOLDER_END */