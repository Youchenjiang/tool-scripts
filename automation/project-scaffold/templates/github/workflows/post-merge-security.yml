# ==============================================================================
# 🔐 Post-Deploy Staging Security Validation (CD 部署後安全驗證)
#
# 【生命週期】
# Post-Deploy Security：在 CD 流程（Deploy / CD）成功完成後觸發部署層安全驗證。
# 避免與 CD 同步並行導致時序衝突、掃描到舊版本或伺服器重啟中斷。
#
# 【定位】
# 在新版程式成功部署至 Staging 環境後執行 DAST 與主機端驗證。
# 靜態檢測（CodeQL、TruffleHog、policy）仍嚴格於 PR 階段執行。
#
# 【啟用條件與額度保護】
# 1. 僅在 CD 成功（conclusion == 'success'）或人工手動觸發時啟動。
# 2. 未配置 `STAGING_URL` 或目標主機時，工作流於數秒內安全跳過，杜絕 Runner 額度浪費。
# ==============================================================================

name: Post-Deploy Security

on:
  workflow_run:
    workflows: ["Deploy", "Deploy to Staging", "Continuous Deployment", "CD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Staging URL override (e.g. https://staging.example.com)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  staging-readiness:
    name: Check staging readiness
    # 僅在 CD 成功或手動觸發時執行
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      target_url: ${{ steps.config.outputs.target_url }}
    env:
      STAGING_URL: ${{ github.event.inputs.target_url || vars.STAGING_URL }}

    steps:
      - name: Check staging configuration
        id: config
        shell: bash
        run: |
          TARGET="${STAGING_URL:-}"
          if [[ -n "${TARGET}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "target_url=${TARGET}" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Post-deploy DAST skipped. Configure STAGING_URL in Repository Variables to enable staging scans."
          fi

      - name: Wait for staging to become reachable
        if: ${{ steps.config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.config.outputs.target_url }}"

          # 輕量快速探測（最多等待約 100 秒，避免長時間卡住 Runner）
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --max-time 10 "${TARGET}" > /dev/null; then
              echo "Staging endpoint is reachable (${TARGET})."
              exit 0
            fi

            echo "Waiting for Staging to be ready (attempt ${attempt}/10)..."
            sleep 10
          done

          echo "::error::Staging endpoint (${TARGET}) did not become reachable within 100 seconds."
          exit 1

  zap:
    name: ZAP baseline scan
    needs: staging-readiness
    if: ${{ needs.staging-readiness.outputs.enabled == 'true' && needs.staging-readiness.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ needs.staging-readiness.outputs.target_url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-post-merge
          cmd_options: '-J report_json.json -x report_xml.xml'

  defectdojo-zap:
    name: Send ZAP report to DefectDojo
    needs: zap
    if: ${{ needs.zap.result == 'success' }}
    uses: ./.github/workflows/defectdojo-upload.yml
    with:
      artifact_name: zap-post-merge
      report_path: report_xml.xml
      scan_type: ZAP Scan
      test_title: Post-Deploy ZAP Scan
      engagement_name: Post-Deploy Security
    secrets: inherit

  faraday-zap:
    name: Send ZAP report to Faraday
    needs: zap
    if: ${{ needs.zap.result == 'success' }}
    uses: ./.github/workflows/faraday-upload.yml
    with:
      artifact_name: zap-post-merge
      report_path: report_xml.xml
    secrets: inherit

  openvas:
    name: Greenbone OpenVAS scan
    needs: staging-readiness
    if: ${{ needs.staging-readiness.outputs.enabled == 'true' && needs.staging-readiness.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENVAS_HOST: ${{ vars.OPENVAS_HOST }}
      OPENVAS_TASK_ID: ${{ vars.OPENVAS_TASK_ID }}
      OPENVAS_SSH_PORT: ${{ vars.OPENVAS_SSH_PORT }}
      OPENVAS_SSH_USERNAME: ${{ vars.OPENVAS_SSH_USERNAME }}
      OPENVAS_GMP_USERNAME: ${{ secrets.OPENVAS_GMP_USERNAME }}
      OPENVAS_GMP_PASSWORD: ${{ secrets.OPENVAS_GMP_PASSWORD }}
      OPENVAS_SSH_PASSWORD: ${{ secrets.OPENVAS_SSH_PASSWORD }}

    steps:
      - name: Check Greenbone integration settings
        id: config
        shell: bash
        run: |
          if [[ -n "${OPENVAS_HOST:-}" &&
                -n "${OPENVAS_TASK_ID:-}" &&
                -n "${OPENVAS_GMP_USERNAME:-}" &&
                -n "${OPENVAS_GMP_PASSWORD:-}" &&
                -n "${OPENVAS_SSH_PASSWORD:-}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Greenbone scan skipped. Configure OPENVAS_HOST, OPENVAS_TASK_ID and credentials to enable it."
          fi

      - name: Install Greenbone gvm-tools
        if: ${{ steps.config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pipx install gvm-tools

      - name: Start Greenbone task and wait for completion
        if: ${{ steps.config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh_port="${OPENVAS_SSH_PORT:-22}"
          ssh_user="${OPENVAS_SSH_USERNAME:-gmp}"

          gvm=(
            gvm-cli
            --timeout 120
            --gmp-username "${OPENVAS_GMP_USERNAME}"
            --gmp-password "${OPENVAS_GMP_PASSWORD}"
            ssh
            --hostname "${OPENVAS_HOST}"
            --port "${ssh_port}"
            --ssh-username "${ssh_user}"
            --ssh-password "${OPENVAS_SSH_PASSWORD}"
            --auto-accept-host
          )

          start_response="$("${gvm[@]}" --xml "<start_task task_id=\"${OPENVAS_TASK_ID}\"/>")"
          report_id="$(
            printf '%s' "${start_response}" |
              python -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); print(root.findtext("report_id") or "")'
          )"

          if [[ -z "${report_id}" ]]; then
            echo "::error::Greenbone did not return a report ID."
            exit 1
          fi

          echo "Greenbone report ID: ${report_id}"

          completed=false
          # 輪詢限制縮減為最多 20 分鐘 (40次 * 30秒)，防止長時空等耗盡配額
          for attempt in {1..40}; do
            task_response="$("${gvm[@]}" --xml "<get_tasks task_id=\"${OPENVAS_TASK_ID}\"/>")"
            task_status="$(
              printf '%s' "${task_response}" |
              python -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); print(root.findtext(".//task/status") or "")'
            )"

            echo "Greenbone task status: ${task_status:-unknown} (poll ${attempt}/40)"

            case "${task_status}" in
              Done)
                completed=true
                break
                ;;
              Stopped|Interrupted|"Internal Error")
                echo "::error::Greenbone task ended with status: ${task_status}"
                exit 1
                ;;
            esac

            sleep 30
          done

          if [[ "${completed}" != "true" ]]; then
            echo "::error::Greenbone task did not finish within 20 minutes."
            exit 1
          fi

          "${gvm[@]}" --raw --xml "<get_reports report_id=\"${report_id}\" details=\"1\" ignore_pagination=\"1\"/>" |
            python -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); report=root.find(".//report"); assert report is not None, "report element missing"; sys.stdout.write(ET.tostring(report, encoding="unicode"))' > openvas-report.xml

      - name: Upload Greenbone report artifact
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: openvas-post-merge
          path: openvas-report.xml
          if-no-files-found: error
          retention-days: 30

  defectdojo-openvas:
    name: Send OpenVAS report to DefectDojo
    needs: openvas
    if: ${{ needs.openvas.result == 'success' }}
    uses: ./.github/workflows/defectdojo-upload.yml
    with:
      artifact_name: openvas-post-merge
      report_path: openvas-report.xml
      scan_type: OpenVAS Parser v2
      test_title: Post-Deploy OpenVAS Scan
      engagement_name: Post-Deploy Security
    secrets: inherit

  faraday-openvas:
    name: Send OpenVAS report to Faraday
    needs: openvas
    if: ${{ needs.openvas.result == 'success' }}
    uses: ./.github/workflows/faraday-upload.yml
    with:
      artifact_name: openvas-post-merge
      report_path: openvas-report.xml
    secrets: inherit

  wazuh-health:
    name: Verify Wazuh runtime monitoring
    needs: staging-readiness
    if: ${{ needs.staging-readiness.outputs.enabled == 'true' && needs.staging-readiness.result == 'success' }}
    uses: ./.github/workflows/wazuh-health.yml
    secrets: inherit
