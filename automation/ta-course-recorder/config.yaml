# 課程與 TA 基本設定
course:
  semester_title: "115學年度第一學期AI融入課程教學紀錄表"
  course_name: "電腦網路安全"
  teacher_name: "陳奕明"
  ta_name: "蔣侑宸"
  start_date: "2026-10-09"   # 第 1 頁起始上課日 (Week 5: 2026-10-09)
  start_time: "14:07"
  end_time: "16:50"
  official_start_time: "14:00"  # 表定時間（第 6~8 節），未觀課週填此時間
  official_end_time: "16:50"
  duration_minutes: 163     # 14:07 ~ 16:50 共 163 分鐘
  total_semester_weeks: 16  # 大學一學期共 16 週，上限絕不超過 Week 16

# 檔案路徑設定
paths:
  template_file: "templates/course_record_template.xlsx"
  output_file: "output/AI輔助教學TA補助計畫課程紀錄表-全學期.xlsx"

# 儲存格座標映射 (Cell Mapping)
cell_mapping:
  semester_title: "A1"     # 表格大標題
  course_name: "B2"        # 課程名稱
  teacher_name: "H2"       # 授課教師姓名
  ta_name: "K2"            # 觀課助理姓名
  date: "B3"               # 觀課日期
  start_time: "H3"         # 觀課開始時間
  end_time: "I3"           # 觀課結束時間
  duration: "K3"           # 課程長度(分鐘)
  attended_yes: "G4"       # 出席狀態：是
  attended_no: "G5"        # 出席狀態：否
  # AI教學內容列起始 (Row 9)；Row 10~13 多餘列已被精簡刪除
  content_row: 9
  # 精準拆欄：對齊第 8 列之各表頭
  col_objective: "A"       # 教學目標
  col_platform: "B"        # 運用平台
  col_pre_name: "C"        # 課前：教學活動名稱
  col_pre_content: "D"     # 課前：教學設計與活動內容
  col_pre_eval: "E"        # 課前：評量策略
  col_in_name: "F"         # 課中：教學活動名稱
  col_in_content: "G"      # 課中：教學設計與活動內容
  col_in_eval: "H"         # 課中：評量策略
  col_post_name: "I"       # 課後：教學活動名稱
  col_post_content: "J"    # 課後：教學設計與活動內容
  col_post_eval: "K"       # 課後：評量策略
  reflection: "F10"        # 刪除多餘列後，整體觀察與省思緊接在 Row 10

# 預設通用內容
default_record:
  platform: "ChatGPT"
  objective: "網路安全實務探討與 AI 協同攻防演練"
  pre_class:
    name: "先備知識預習"
    content: "閱讀當週教材與實驗指引，使用 AI 釐清核心協定運作機制與潛在攻擊面。"
    eval: "課前提問檢視"
  in_class:
    name: "課堂實作演練"
    content: "進行資安工具操作與靶機演練，引導學生運用 AI 分析封包及除錯報錯。"
    eval: "實作進度確認"
  post_class:
    name: "實驗檢討與交付"
    content: "於 eeclass 繳交實驗報告或挑戰 Writeup，總結 AI 協同分析的心得。"
    eval: "作業成果審查"
  reflection: "1. 使用方式與過程：課堂引導學生以 AI 作為輔助除錯與分析工具。\n2. 學生反應與狀況：學生能主動詢問實作卡關細節，課堂參與度佳。\n3. 困難與問題：部分同學指令參數不熟，經 AI 解釋後逐步釐清。\n4. 效益與特色：顯著降低基礎環境排錯時間，提升實作流暢度。"

# 每週特定內容
weeks:
  5:
    date: "2026-10-09"
    is_holiday: true
    holiday_reason: "國慶日補假停課"

  6:
    date: "2026-10-16"
    start_time: "14:07"
    end_time: "16:52"
    objective: "熟悉資安 CTF 平台 (Cylab) 操作，掌握各類網路攻擊型態與駭客技術基礎"
    platform: "Claude"
    pre_class:
      name: "平台註冊與基礎預習"
      content: "指引學生以邀請碼加入 Cylab 平台；透過 AI 預習常見 Web / Network 攻擊分類（DoS、Injection、Phishing 等）。"
      eval: "平台前測概念題"
    in_class:
      name: "A2 - Cylab Basic 實務解題"
      content: "帶領同學練習 Cylab Basic 題目，引導學生以 Claude 理解題目涉及的協定與攻擊概念、解讀錯誤訊息，作為解題的輔助而非直接索取答案。"
      eval: "TA 巡視解題進度與後台 Submit 狀況"
    post_class:
      name: "A2 作業與 Writeup 總結"
      content: "要求學生於 eeclass 繳交 A2 Cylab Basic 解題 Writeup，說明解題思路、邏輯與 AI 協同過程。"
      eval: "Writeup 完整性與原理理解評分"
    reflection: "1. 使用方式與過程：實戰作業中學生多以 Claude 理解題目背後的知識並協助解題，例如解釋協定、攻擊類型與錯誤訊息。\n2. 學生反應與狀況：多數同學初次接觸 CTF 平台，透過 AI 補足先備知識後較能自行動手嘗試，課堂參與度提高。\n3. 困難與問題：初期部分同學習慣直接向 AI 要答案，TA 引導改為請 AI 解釋原理、自己完成操作與判斷。\n4. 效益與特色：AI 補足背景知識的落差，讓不同程度的同學都能跟上實作，TA 可把時間花在觀念講解。"

  7:
    date: "2026-10-23"
    is_holiday: true
    holiday_reason: "颱風假停課"

  8:
    date: "2026-10-30"
    start_time: "14:06"
    end_time: "16:51"
    objective: "理解駭客技術與 APT 攻擊生命週期，並掌握主機滲透實作流程 (Recon to Shell)"
    platform: "Claude"
    pre_class:
      name: "Lesson 3 與 APT 補充教材研讀"
      content: "課前研讀 Lesson 3 Hacker Techniques 與補充之一 APT 介紹，利用 AI 整理 APT 攻擊階段與代表性案例。"
      eval: "APT 生命週期理解問答"
    in_class:
      name: "A3 - Recon to Shell 滲透實作"
      content: "講解資訊蒐集 (Recon) 至取得權限 (Shell) 全流程，學生以 Claude 理解 Nmap 掃描結果、服務版本與對應漏洞的意義，再自行操作驗證；另說明個人報告規劃方式。"
      eval: "能否正確辨識攻擊面並取得 Shell"
    post_class:
      name: "A3 實驗報告與個人報告規劃"
      content: "繳交 A3 - Recon to Shell 實作紀錄，並依個人報告說明開始擬定報告主題。"
      eval: "實作復現程度與報告主題可行性"
    reflection: "1. 使用方式與過程：學生以 Claude 理解 Nmap 掃描結果、服務版本與漏洞資訊，並查詢取得 Shell 所需指令的用法，再自行操作驗證。\n2. 學生反應與狀況：同學對實際取得 Shell 的攻防實作興趣高，願意自行嘗試不同參數組合。\n3. 困難與問題：AI 給出的指令未必符合實驗環境，需要學生自己對照實際輸出判斷，TA 現場協助除錯。\n4. 效益與特色：AI 降低查閱指令與漏洞資料的門檻，讓課堂時間能集中在 Recon 到 Shell 的完整流程。"

  9:
    date: "2026-11-06"
    start_time: "14:09"
    end_time: "16:47"
    objective: "認識 Rootkits、作業系統安全與 MITRE ATT&CK 框架，並掌握檔案鑑識基本流程（辨識、看明文、拆解隱藏內容）"
    platform: "Claude"
    pre_class:
      name: "Hacker Techniques 補充教材研讀"
      content: "研讀補充之二 Root Kits、補充之三 OS Security、補充之四 MITRE ATT&CK，利用 AI 整理 Rootkit 類型與隱匿手法，並對照 ATT&CK 戰術矩陣。"
      eval: "Rootkit 與 ATT&CK 戰術概念問答"
    in_class:
      name: "A4 - Cylab Files 檔案鑑識實作"
      content: "以 Matryoshka doll 示範用 file 辨識真實格式、strings 看明文、binwalk 找出隱藏檔並逐層拆解；學生接著實作 Secret of the Polyglot，以 Claude 協助理解檔頭 magic bytes 與工具輸出。"
      eval: "TA 巡視能否說明每層檔案的辨識依據，並完成平台 Submit"
    post_class:
      name: "A4 作業填答"
      content: "於 eeclass 填答 A4：Matryoshka doll 的四層結構與拆解方式、file 與 binwalk 如何判斷 jpg 中藏有資料；Polyglot 兩半 flag 來源與 PNG、PDF 在檔案中的位置。"
      eval: "答案正確性與檔案格式原理說明"
    reflection: "1. 使用方式與過程：學生將 file、binwalk 等工具輸出交給 Claude 解讀，理解檔頭與檔尾標記代表的意義，再自行逐層拆解。\n2. 學生反應與狀況：發現一張看似正常的 jpg 裡藏有多層檔案時反應熱烈，對「副檔名不代表真實格式」印象深刻。\n3. 困難與問題：部分同學不熟 terminal 操作，且拆出的檔案需再從頭檢查，容易遺漏；AI 的解讀仍需以工具結果核對。\n4. 效益與特色：AI 協助快速理解各種檔案格式結構，配合 Rootkit、OS Security 教材，讓學生理解攻擊者隱藏資料的手法與鑑識觀念。"

  10:
    date: "2026-11-13"
    start_time: "14:08"
    end_time: "16:49"
    objective: "認識 Open DNS Resolver 放大攻擊與 Athens Affair 案例，並理解 SQL 注入成因，掌握探針、閉合、繞過登入到 UNION 取資料的流程與防禦"
    platform: "Claude\nChatGPT"
    pre_class:
      name: "補充教材研讀與 SQL 基礎預習"
      content: "研讀 Hacker Techniques 補充之五（Open-dns-resolver Attack）與補充之六（The Athens Affair），利用 AI 整理 DNS 放大攻擊原理與案例時間軸；並以 AI 複習 SELECT / WHERE / UNION 語法與登入驗證查詢的組成。"
      eval: "DNS 放大攻擊與 SQL 語法概念問答"
    in_class:
      name: "A5 - Cylab SQLi 實作"
      content: "以 SQL Direct 熟悉資料庫結構，示範單引號探針、閉合與註解截斷、恆真條件繞過登入、UNION 取別張資料表（More SQLi），再由學生實作 Irish-Name-Repo 1/2；學生以 Claude 或 ChatGPT 查詢 psql 指令與 SQL 語法、理解注入原理。"
      eval: "TA 巡視能否說明 payload 如何改變原查詢，並完成平台 Submit"
    post_class:
      name: "A5 作業與防禦反思"
      content: "於 eeclass 填答 A5：flag 所在資料表與指令、兩題 Irish-Name-Repo 的帳密與差異，並附 AI 使用聲明；選作另找一題 SQLi 說明原理。整理參數化查詢等防禦方式。"
      eval: "答案正確性與原理說明、AI 使用聲明完整性"
    reflection: "1. 使用方式與過程：本週作業首次要求附 AI 使用聲明。依學生聲明，多數以 Claude 為主（少數使用 ChatGPT），用於查詢 psql 指令與 SQL 語法、理解單引號、OR 條件與註解符號的作用，也有人用來解讀選作題的位移提示、協助潤飾答案文字。\n2. 學生反應與狀況：多數聲明強調實際操作與關鍵判斷由自己完成、AI 只協助理解，顯示學生已從直接向 AI 要答案，轉為把 AI 當作查詢與引導的工具；有同學讓 AI 一步步引導分析錯誤訊息，也有同學先自行測試 Irish-Name-Repo 2 的過濾規則，再與 AI 討論歸納出結論，另有同學延伸整理其他 CTF 題目的解題筆記。\n3. 困難與問題：平台偶有送出後無回應的狀況，學生透過 AI 理解講義中的替代寫法後解決；另有同學直接從搜尋引擎的 AI 摘要取得解法，略過自行推理的過程，需提醒以 AI 引導思考而非直接取答案。\n4. 效益與特色：AI 使用聲明讓學生反思自己如何使用 AI，也讓 TA 掌握學生實際的使用方式，作為後續引導的依據。"

  11:
    date: "2026-11-20"
    is_holiday: true
    holiday_reason: "助教請病假"
    ta_absent: true   # 課程照常進行但助教未到：課中/課後填「未知」
    unknown_text: "未知（助教請病假未到課，課堂實行情形待後續了解）"
    reflection: "1. 已知部分：本週課程照常進行，老師於 eeclass 公告 MITRE ATT&CK（更新）、駭客思維—以水軍為例之反思、Lesson 4 Information Security Services 三份教材。\n2. 未知部分：助教請病假未到課，課堂實際進行方式、學生 AI 使用情形與反應均未能觀察。\n3. 後續處理：待下次上課向老師或同學了解本週實行情形後補充。"
    objective: "認識 MITRE ATT&CK 更新內容、從水軍案例反思駭客思維，並理解資訊安全服務（Lesson 4）的核心機制"
    platform: "未觀察（助教請病假）"
    pre_class:
      name: "eeclass 公告教材研讀"
      content: "老師於 eeclass 公告本週教材：Hacker Techniques 補充之四 MITRE ATT&CK（更新）、補充之七 駭客思維—以水軍為例之反思、Lesson 4 Information Security Services，供學生課前閱讀。學生是否運用 AI 研讀未能得知。"
      eval: "eeclass 教材閱讀紀錄"
